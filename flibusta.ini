# Настройки читаются из этого файла рядом с flibusta.py.
# Можно выбрать другой файл командой: fli --config /путь/к/файлу -a "Имя автора"
# Строки, начинающиеся с #, являются комментариями.

[defaults]
# Языки и форматы по умолчанию для обычной загрузки и для -s.
# Несколько значений разделяются пробелами, например:
# languages = ru en
# formats = fb2 pdf
# -l и -f в командной строке заменяют соответствующие списки на один запуск.
# Коды языков берутся из каталога книг, обычно ru, en и т. п.
# Допустимые форматы: fb2, djvu, pdf, epub, mobi, txt, rtf, html.
# Скачаются только форматы, которые доступны у конкретной книги.
languages = ru
formats = fb2

[site]
# Адрес сайта для поиска по -a "Имя автора" и для числового ID автора.
# Например, mirror = https://flibusta.is или адрес совместимого зеркала.
# Если указан полный URL автора, например https://домен/a/2583,
# программа использует домен этого URL вместо mirror.
# При сетевой ошибке веб-поиска программа пробует OPDS на том же сайте;
# для flibusta.is дополнительно пробует https://flub.flibusta.is.
mirror = https://flibusta.is

[downloads]
# Число книг/форматов, загружаемых одновременно: целое число от 1 до 16.
# Каждый работник скачивает один файл целиком; они не делят файл на части.
# Значение 4 обычно достаточно; повышение создаёт больше запросов к сайту
# и увеличивает расход памяти, поскольку файл сначала читается целиком.
workers = 4
# no: сохранять ZIP, например «Название [123].fb2.zip».
# yes: распаковывать ZIP и сохранять книгу как «Название [123].fb2».
# Ключ -x включает распаковку для одного запуска независимо от этой настройки.
# При -r используется выбор, записанный при исходной загрузке; -r -x его включает.
# RAR сохраняется архивом; EPUB сохраняется как .epub.
extract_zip = no
